<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML форма</title>
</head>
<body>
    <form method="post" action="form.html">
        <h1>Регистрация</h1>
        <input type="text" placeholder="ФИО"> <br>
        <input type="number" placeholder="+7 999 999 99 99"> <br>
        <input type="date" placeholder="дата рождения"> <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">мужчина</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">женщина</label> <br>
        <input type="checkbox" id="agreement" name="agreement" value="agreement">
        <label for="agreement">Согласие на обработку</label> <br>
        <input type="submit" value="Отправить">
    </form>

       <h4>Список:</h4>
       <ul>
          <li>Задача 1</li>
          <li>Задача 2</li>
          <li>Задача 3</li>
       </ul>
</body>
</html>

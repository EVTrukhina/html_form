<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>html_css_form</title>
</head>
<body>
<h1>Заполните форму, чтобы оставить отзыв</h1>
<p>Lorem ipsum dolor sit amet consectetur adipiscing elit posuere vel venenatis eu sit massa volutpat massa rhoncus odio feugiat tellus, elit massa sed.</p>
  <form>
    <label>
        Имя*
        <input type="text" placeholder="Имя" name="name" required pattern="[А-Яа-яЁё]"> <br>
    </label>
    <label>
          Email
          <input type="email" placeholder="ivan@domain.ru" name="email"> <br>
    </label>
    <label>
          Мобильный телефон *
          <input type="text" placeholder="+7 (921) 111-45-55" name="number" required pattern="7-[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}"> <br>
    </label>
    <label>
          Дата рождения
          <input type="date" placeholder="01.08.1977" name="birth_date"> <br>
    </label>
      <select>
        <option selected class="selected"> Выберите категорию </option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select> <br>
    <label>
        Сообщение
        <textarea name="description" rows="5" placeholder="Введите ваше сообщение..." maxlength="100"> </textarea><br>
    </label>

    <label for="agreement">
        <input type="checkbox" id="agreement" name="agreement" value="agreement">
        Заполняя форму, я <a href = "http://www.yandex.ru">принимаю условия передачи информации.</a>
    </label> <br>

    <input type="submit" value="Отправить заявку">
  </form>
</body>
</html>

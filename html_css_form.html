<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>html_css_form</title>
    <link rel="stylesheet" href="html_css_form.css">
</head>

<body>
<h1 class=”title”> Заполните форму, чтобы оставить отзыв <h1/>
    <p class="sub-text">Lorem ipsum dolor sit amet consectetur adipiscing elit posuere vel venenatis eu sit massa volutpat massa rhoncus odio eugiat tellus, elit massa sed.</p>
    <form action="/submit" method="post">
        <!-- Имя и Email в одной строке -->
        <div class="row-group">
            <div class="form-group">
                <label for="name" class="form-label">Имя*</label>
                <input type="text" id="name" name="name" placeholder="Имя" value=”” required/>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" placeholder="ivan.domain.ru" value=””/> <br/>
            </div>
        </div>
        <!-- Моб. телефони и дата рождения в одной строке -->
        <div class="row-group">
            <div class="form-group">
                <label for="tel" class="form-label">Мобильный телефон*</label>
                <input type="tel" id="tel" name="tel" placeholder="+7 (921) 111-45-55" value=”” required/>
            </div>
            <div class="form-group">
                <label for="date" class="form-label">Дата рождения</label>
                <input type="date" id="date" name="date" placeholder="01.08.1977" value=””/> <br/>
            </div>
        </div>
        <div class="form-group">
            <label for="message" class="form-label">Сообщение</label>
            <textarea id="message" cols=”40” rows=”10” name="textarea"
                      placeholder="Введите ваше сообщение..."></textarea>
        </div>
        <div class="form-check">
            <label>
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">Заполняя форму, я принимаю <a href="/terms">условия передачи информации</label>
            </label>
        </div>
        <input type="submit" name="submit" value=”Отправить заявку”/> <br/>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>html_css_form</title>
</head>
<body>
  <form>
    <label>
        Имя*
        <input type="text" placeholder="Имя" name="name">  <br>
    </label>
    <label>
          Email
          <input type="text" placeholder="ivan@domain.ru" name="email"> <br>
    </label>
    <label>
          Мобильный телефон *
          <input type="text" placeholder="+7 (921) 111-45-55" name="number"> <br>
    </label>
    <label>
          Дата рождения
          <input type="text" placeholder="01.08.1977" name="birth_date"> <br>
    </label>
      <select>
        <option selected class="selected"> Выберите категорию </option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select> <br>
    <label>
        Сообщение
        <textarea name="description" rows="5" placeholder="Введите ваше сообщение..."> </textarea><br>
    </label>
    <input type="checkbox" id="agreement" name="agreement" value="agreement">
    <label for="agreement">Заполняя форму, я <a href = "http://www.yandex.ru">принимаю условия передачи информации.</a></label> <br>
    <input type="submit" value="Отправить заявку">
  </form>
</body>
</html>
